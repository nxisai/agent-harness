<svg xmlns="http://www.w3.org/2000/svg" color="#B0BCCF" viewBox="0 0 960 268" role="img" aria-label="A turn checks a rule table first and routes with no model call. If the rules are unclear a short classification pass runs. The chosen specialist keeps handling later turns without re-routing, and can hand back once if the topic changed.">
        <defs>
          <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
          </marker>
        </defs>

        <rect x="0" y="60" width="120" height="42" rx="9" fill="none" stroke="currentColor" stroke-width="1.3"/>
        <text x="60" y="79" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" fill="currentColor">user turn</text>
        <text x="60" y="94" text-anchor="middle" font-family="Inter,sans-serif" font-size="10.5" fill="currentColor" opacity=".6">+ transcript</text>

        <line x1="120" y1="81" x2="168" y2="81" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar2)"/>

        <rect x="170" y="52" width="146" height="58" rx="9" fill="none" stroke="#7CA6FF" stroke-width="1.5"/>
        <text x="243" y="74" text-anchor="middle" font-family="Manrope,sans-serif" font-weight="700" font-size="12.5" fill="#7CA6FF">rule table</text>
        <text x="243" y="92" text-anchor="middle" font-family="Inter,sans-serif" font-size="10.5" fill="currentColor" opacity=".7">verbs, tool names</text>

        <line x1="316" y1="81" x2="372" y2="81" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar2)"/>
        <text x="344" y="72" text-anchor="middle" font-family="Inter,sans-serif" font-size="10.5" fill="currentColor" opacity=".75">clear</text>

        <path d="M 243 110 L 243 168" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#ar2)"/>
        <text x="252" y="142" font-family="Inter,sans-serif" font-size="10.5" fill="currentColor" opacity=".75">unclear</text>

        <rect x="170" y="170" width="146" height="56" rx="9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="4 4"/>
        <text x="243" y="192" text-anchor="middle" font-family="Manrope,sans-serif" font-weight="700" font-size="12" fill="currentColor">classify pass</text>
        <text x="243" y="209" text-anchor="middle" font-family="Inter,sans-serif" font-size="10.5" fill="currentColor" opacity=".7">~120 tok in, 1 word out</text>

        <path d="M 316 198 L 400 198 L 400 116" stroke="currentColor" stroke-width="1.3" fill="none" marker-end="url(#ar2)"/>

        <rect x="374" y="52" width="176" height="58" rx="9" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <text x="462" y="75" text-anchor="middle" font-family="Manrope,sans-serif" font-weight="700" font-size="12.5" fill="currentColor">specialist harness</text>
        <text x="462" y="93" text-anchor="middle" font-family="Inter,sans-serif" font-size="10.5" fill="currentColor" opacity=".7">its prompt + its tools</text>

        <line x1="550" y1="81" x2="606" y2="81" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar2)"/>
        <text x="578" y="72" text-anchor="middle" font-family="Inter,sans-serif" font-size="10.5" fill="currentColor" opacity=".75">turn()</text>

        <rect x="608" y="52" width="150" height="58" rx="9" fill="none" stroke="currentColor" stroke-width="1.3"/>
        <text x="683" y="75" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" fill="currentColor">decide · ask · run</text>
        <text x="683" y="93" text-anchor="middle" font-family="Inter,sans-serif" font-size="10.5" fill="currentColor" opacity=".6">the harness, as ever</text>

        <line x1="758" y1="81" x2="814" y2="81" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar2)"/>
        <rect x="816" y="60" width="136" height="42" rx="9" fill="none" stroke="currentColor" stroke-width="1.3"/>
        <text x="884" y="86" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" fill="currentColor">rendered answer</text>

        <!-- sticky loop -->
        <path d="M 462 110 L 462 150 L 884 150 L 884 102" stroke="#7CA6FF" stroke-width="1.3" fill="none" marker-end="url(#ar2)" stroke-dasharray="5 4"/>
        <text x="673" y="144" text-anchor="middle" font-family="Inter,sans-serif" font-size="10.5" fill="#7CA6FF">next turn stays here — no routing pass</text>

        <!-- hand back -->
        <path d="M 550 96 L 570 96 L 570 236 L 400 236 L 400 116" stroke="currentColor" stroke-width="1.2" fill="none" marker-end="url(#ar2)" opacity=".7"/>
        <text x="485" y="252" text-anchor="middle" font-family="Inter,sans-serif" font-size="10.5" fill="currentColor" opacity=".7">"not mine" — moved once to the tool's owner, whose answer then stands</text>
      </svg>
