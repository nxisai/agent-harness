<svg xmlns="http://www.w3.org/2000/svg" color="#B0BCCF" viewBox="0 0 960 372" role="img" aria-label="Today every turn loads one system prompt and all ten tool definitions, 2476 tokens. Proposed, a coordinator with no tools routes to one of four specialists, each loading only its own prompt and tools, 506 to 611 tokens per turn.">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
          </marker>
        </defs>

        <!-- ── TODAY ───────────────────────────────────────────── -->
        <text x="0" y="14" font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="1.6" fill="currentColor" opacity=".65">SINGLE AGENT</text>

        <rect x="0" y="34" width="150" height="34" rx="8" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"/>
        <text x="75" y="56" text-anchor="middle" font-family="Inter,sans-serif" font-size="12.5" fill="currentColor">user turn</text>

        <line x1="75" y1="68" x2="75" y2="104" stroke="currentColor" stroke-width="1.2" marker-end="url(#ar)"/>

        <rect x="0" y="106" width="380" height="128" rx="11" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <text x="16" y="130" font-family="Manrope,sans-serif" font-weight="700" font-size="14" fill="currentColor">One agent, every tool</text>
        <text x="16" y="152" font-family="Inter,sans-serif" font-size="12" fill="currentColor" opacity=".8">system prompt · everything at once</text>
        <text x="364" y="130" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="12" fill="currentColor">560</text>

        <line x1="16" y1="166" x2="364" y2="166" stroke="currentColor" stroke-width="1" opacity=".3"/>
        <text x="16" y="188" font-family="Inter,sans-serif" font-size="12" fill="currentColor" opacity=".8">10 tool definitions</text>
        <text x="364" y="188" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="12" fill="currentColor">1,916</text>
        <text x="16" y="210" font-family="Inter,sans-serif" font-size="12" fill="currentColor" opacity=".55">query · get · list · action · 6 forms</text>
        <text x="364" y="216" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="500" fill="currentColor">2,476 / turn</text>

        <line x1="190" y1="234" x2="190" y2="268" stroke="currentColor" stroke-width="1.2" marker-end="url(#ar)"/>
        <rect x="90" y="270" width="200" height="34" rx="8" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"/>
        <text x="190" y="292" text-anchor="middle" font-family="Inter,sans-serif" font-size="12.5" fill="currentColor">picks 1 of 10 tools</text>

        <!-- divider -->
        <line x1="452" y1="20" x2="452" y2="340" stroke="currentColor" stroke-width="1" opacity=".22" stroke-dasharray="3 5"/>

        <!-- ── PROPOSED ────────────────────────────────────────── -->
        <text x="516" y="14" font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="1.6" fill="#7CA6FF">SPECIALISTS</text>

        <rect x="516" y="34" width="150" height="34" rx="8" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"/>
        <text x="591" y="56" text-anchor="middle" font-family="Inter,sans-serif" font-size="12.5" fill="currentColor">user turn</text>

        <line x1="591" y1="68" x2="591" y2="102" stroke="currentColor" stroke-width="1.2" marker-end="url(#ar)"/>

        <rect x="516" y="104" width="290" height="52" rx="10" fill="none" stroke="#7CA6FF" stroke-width="1.6"/>
        <text x="532" y="126" font-family="Manrope,sans-serif" font-weight="700" font-size="13.5" fill="#7CA6FF">Coordinator</text>
        <text x="532" y="145" font-family="Inter,sans-serif" font-size="11.5" fill="currentColor" opacity=".8">classify only · no tools</text>
        <text x="790" y="134" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="12" fill="#7CA6FF">~120</text>

        <text x="824" y="134" font-family="Inter,sans-serif" font-size="11" fill="currentColor" opacity=".6">rules first,</text>
        <text x="824" y="149" font-family="Inter,sans-serif" font-size="11" fill="currentColor" opacity=".6">model only if unclear</text>

        <!-- fan-out: one coordinator, four slices -->
        <line x1="661" y1="156" x2="661" y2="192" stroke="currentColor" stroke-width="1.2"/>
        <line x1="481" y1="192" x2="841" y2="192" stroke="currentColor" stroke-width="1.2"/>
        <line x1="481" y1="192" x2="481" y2="216" stroke="currentColor" stroke-width="1.2" marker-end="url(#ar)"/>
        <line x1="601" y1="192" x2="601" y2="216" stroke="currentColor" stroke-width="1.2" marker-end="url(#ar)"/>
        <line x1="721" y1="192" x2="721" y2="216" stroke="currentColor" stroke-width="1.2" marker-end="url(#ar)"/>
        <line x1="841" y1="192" x2="841" y2="216" stroke="currentColor" stroke-width="1.2" marker-end="url(#ar)"/>
        <rect x="427" y="218" width="108" height="92" rx="10" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <text x="439" y="240" font-family="Manrope,sans-serif" font-weight="700" font-size="12" fill="currentColor">Retrieval</text>
        <text x="439" y="258" font-family="Inter,sans-serif" font-size="10" fill="currentColor" opacity=".75">query · get</text>
        <text x="439" y="274" font-family="Inter,sans-serif" font-size="10" fill="currentColor" opacity=".55">types, filters</text>
        <text x="523" y="299" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="11.5" fill="currentColor">611</text>
        <rect x="547" y="218" width="108" height="92" rx="10" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <text x="559" y="240" font-family="Manrope,sans-serif" font-weight="700" font-size="12" fill="currentColor">Booking</text>
        <text x="559" y="258" font-family="Inter,sans-serif" font-size="10" fill="currentColor" opacity=".75">booking · lookup</text>
        <text x="559" y="274" font-family="Inter,sans-serif" font-size="10" fill="currentColor" opacity=".55">windows, 24h line</text>
        <text x="643" y="299" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="11.5" fill="currentColor">506</text>
        <rect x="667" y="218" width="108" height="92" rx="10" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <text x="679" y="240" font-family="Manrope,sans-serif" font-weight="700" font-size="12" fill="currentColor">Quote</text>
        <text x="679" y="258" font-family="Inter,sans-serif" font-size="10" fill="currentColor" opacity=".75">quote · contact</text>
        <text x="679" y="274" font-family="Inter,sans-serif" font-size="10" fill="currentColor" opacity=".55">scope, no prices</text>
        <text x="763" y="299" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="11.5" fill="currentColor">574</text>
        <rect x="787" y="218" width="108" height="92" rx="10" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <text x="799" y="240" font-family="Manrope,sans-serif" font-weight="700" font-size="12" fill="currentColor">Forms</text>
        <text x="799" y="258" font-family="Inter,sans-serif" font-size="10" fill="currentColor" opacity=".75">plan · jobs</text>
        <text x="799" y="274" font-family="Inter,sans-serif" font-size="10" fill="currentColor" opacity=".55">tiers, roles</text>
        <text x="883" y="299" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="11.5" fill="currentColor">522</text>
        <text x="516" y="336" font-family="Inter,sans-serif" font-size="11.5" fill="currentColor" opacity=".65">one engine · one transcript · one tool slice loaded per turn</text>
      </svg>
